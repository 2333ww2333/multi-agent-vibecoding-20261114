[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multi-agent"
version = "0.1.0"
description = "单进程多线程的多智能体协作运行时（教学级工程实现）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "pytest>=9.2.0",
    "texts>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5.0", "httpx>=0.27"]
mcp = ["mcp>=1.0.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
magent = "agent.runner:main"
magent-web = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["agent"]
omit = ["agent/runner.py", "agent/tools/mcp.py"]



